AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal ECS Fargate service for BookLending

Parameters:
  ImageUri:
    Type: String
    Description: Docker image URI (ECR), e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/booklending:latest
  ClusterName:
    Type: String
    Default: booklending-cluster

Resources:
  BookLendingCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  BookTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: booklending-task
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: booklending
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 80

  BookService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref BookLendingCluster
      ServiceName: booklending-service
      TaskDefinition: !Ref BookTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - subnet-xxxxxx   # Replace with actual subnet IDs
            - subnet-yyyyyy
          SecurityGroups:
            - sg-xxxxxxxx     # Replace with actual security group ID
